# AlexNet encoder trained from scratch for 200-class bird classification.
# Same data, split and normalisation as cls_scratch.yaml, so the runs are comparable.
# Paths are relative to the repository root; run the CLI from there.
# Any value can be overridden from the command line, e.g. --set train.lr=0.0003

experiment:
  name: alexnet_augmented
  seed: 42
  output_dir: outputs/classification

data:
  original_images: src/data/original/images
  original_metadata: src/data/original/metadata/metadata.csv
  augmented_images: src/data/processed/augmented/images
  augmented_metadata: src/data/processed/augmented/metadata/metadata.csv
  use_offline_augmented: true    # originals + the Task 1.1 augmented copies
  val_per_class: 5
  split_file: splits/val_original_ids.json
  stats_file: splits/norm_stats.json
  hf_cache_dir: null
  image_size: 224
  resize_size: 256
  crop_scale: [0.35, 1.0]
  color_jitter: 0.1
  batch_size: 64
  num_workers: 4

model:
  name: alexnet
  num_classes: 200
  width_mult: 1.0
  fc_dim: 4096
  fc_dropout: 0.5     # dropout before FC6 and FC7, as in the original AlexNet
  batch_norm: true
  dropout: 0.0        # classifier head (FC8); FC7 is already followed by dropout

train:
  epochs: 80
  lr: 0.0005
  weight_decay: 0.05
  warmup_epochs: 5
  label_smoothing: 0.1
  early_stopping_patience: 20
  amp: true
  save_checkpoint: true
  max_batches: null   # limit batches per epoch, only for quick smoke tests
  resume_from: null   # last.pt or best.pt of an interrupted run to continue from

tracking:
  backend: wandb      # wandb | none
  project: cub-pixels-to-language
  entity: null
  mode: online        # online | offline
  group: null
  log_checkpoint: true
